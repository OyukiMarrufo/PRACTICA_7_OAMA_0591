<!DOCTYPE html> <!-- Declara el documento como HTML5 -->
<html lang="es"> <!-- Abre el documento en español -->
<head> <!-- Inicio de metadatos -->
  <meta charset="UTF-8"> <!-- Soporte para acentos y caracteres -->
  <title>Formulario con Checkbox</title> <!-- Título de la pestaña -->
</head> <!-- Fin de metadatos -->
<body> <!-- Inicio del cuerpo del sitio -->

<h2>Formularios con checkbox</h2> <!-- Subtítulo principal -->
<form action="" method="post"> <!-- Formulario (envía vía POST) -->

  <label for="nombre">Ingresa tu nombre:</label> <!-- Etiqueta para el nombre -->
  <input type="text" id="nombre" name="nombre"> <!-- Campo de entrada de texto -->
  <br><br> <!-- Saltos de línea -->

  <p>Selecciona los lenguajes que conozcas:</p> <!-- Texto descriptivo -->

  <input type="checkbox" id="java" name="lenguajes" value="Java"> <!-- Casilla de selección Java -->
  <label for="java">Java</label><br> <!-- Etiqueta vinculada a Java -->

  <input type="checkbox" id="python" name="lenguajes" value="Python"> <!-- Casilla de selección Python -->
  <label for="python">Python</label><br> <!-- Etiqueta vinculada a Python -->

  <input type="checkbox" id="csharp" name="lenguajes" value="C#"> <!-- Casilla de selección C# -->
  <label for="csharp">C#</label><br> <!-- Etiqueta vinculada a C# -->

  <input type="checkbox" id="flutter" name="lenguajes" value="Flutter"> <!-- Casilla de selección Flutter -->
  <label for="flutter">Flutter</label><br> <!-- Etiqueta vinculada a Flutter -->

</form> <!-- Fin del formulario -->

</body> <!-- Fin del cuerpo -->
</html> <!-- Fin del documento HTML -->
