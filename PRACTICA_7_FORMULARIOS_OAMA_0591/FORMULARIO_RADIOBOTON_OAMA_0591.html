<!DOCTYPE html> <!-- Declara el documento como HTML5 -->
<html lang="es"> <!-- Abre el documento en español -->
<head> <!-- Inicio de metadatos -->
  <meta charset="UTF-8"> <!-- Soporte para acentos y caracteres -->
  <title>Formulario con Radiobotón</title> <!-- Título de la pestaña -->
</head> <!-- Fin de metadatos -->
<body> <!-- Inicio del cuerpo del sitio -->

<h2>Formularios con Radioboton</h2> <!-- Subtítulo principal -->
<form action="" method="post"> <!-- Formulario (envía vía POST) -->

  <label for="nombre">Ingresa tu nombre:</label> <!-- Etiqueta para el nombre -->
  <input type="text" id="nombre" name="nombre"> <!-- Campo de entrada de texto -->
  <br><br> <!-- Saltos de línea -->

  <p>Selecciona el maximo de estudios que tienes:</p> <!-- Texto descriptivo -->

  <input type="radio" id="sin_estudios" name="estudios" value="1"> <!-- Botón de opción: Sin estudios -->
  <label for="sin_estudios">Sin estudios</label><br> <!-- Etiqueta vinculada a Sin estudios -->

  <input type="radio" id="primaria" name="estudios" value="2"> <!-- Botón de opción: Primaria -->
  <label for="primaria">Primaria</label><br> <!-- Etiqueta vinculada a Primaria -->

  <input type="radio" id="secundaria" name="estudios" value="3"> <!-- Botón de opción: Secundaria -->
  <label for="secundaria">Secundaria</label><br> <!-- Etiqueta vinculada a Secundaria -->

  <input type="radio" id="preparatoria" name="estudios" value="4"> <!-- Botón de opción: Preparatoria -->
  <label for="preparatoria">Preparatoria</label><br><br> <!-- Etiqueta vinculada a Preparatoria -->

  <input type="submit" value="enviar"> <!-- Botón de envío -->
  <input type="reset" value="borrar"> <!-- Botón de borrado -->

</form> <!-- Fin del formulario -->

</body> <!-- Fin del cuerpo -->
</html> <!-- Fin del documento HTML -->
