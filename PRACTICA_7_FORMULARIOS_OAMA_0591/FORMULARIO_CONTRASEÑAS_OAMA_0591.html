<!DOCTYPE html> <!-- Declara el tipo de documento HTML5 -->
<html lang="es"> <!-- Abre el documento HTML -->
<head> <!-- Inicio de la configuracion -->
  <meta charset="UTF-8"> <!-- Codificacion para acentos y caracteres especiales -->
  <title>Formulario de Contraseña</title><!-- Titulo en la pestana del navegador -->
</head> <!-- Fin de la configuracion -->
<body> <!-- Inicio del contenido visible -->

<h2>Formulario para contraseñas</h2> <!-- Subtitulo del formulario -->
<form action="" method="post"> <!-- Abre el formulario (envio POST) -->

  <label for="usuario">Ingresa tu usuario:</label> <!-- Etiqueta accesible para el usuario -->
  <input type="text" id="usuario" name="usuario"> <!-- Campo de texto para el usuario -->
  <br><br> <!-- Saltos de linea para dar espacio -->

  <label for="pass">Ingresa tu contraseña:</label> <!-- Etiqueta accesible para la contrasena -->
  <input type="password" id="pass" name="pass"> <!-- Campo oculto para la contrasena -->
  <br><br> <!-- Saltos de linea para dar espacio -->

  <input type="submit" value="enviar"> <!-- Boton para enviar la informacion -->
  <input type="reset" value="borrar"> <!-- Boton para limpiar los datos del formulario -->

</form> <!-- Fin del formulario -->

</body> <!-- Fin del cuerpo de la pagina -->
</html> <!-- Fin del documento HTML -->
