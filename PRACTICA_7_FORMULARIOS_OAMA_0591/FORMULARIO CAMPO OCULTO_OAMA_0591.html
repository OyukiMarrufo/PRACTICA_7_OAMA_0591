<!DOCTYPE html> <!-- Declara el documento como HTML5 -->
<html lang="es"> <!-- Abre el documento en español -->
<head> <!-- Inicio de metadatos -->
  <meta charset="UTF-8"> <!-- Soporte para acentos y caracteres -->
  <title>Formulario con Campo Oculto</title> <!-- Título de la pestaña -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"> <!-- Carga la librería Font Awesome -->
</head> <!-- Fin de metadatos -->
<body> <!-- Inicio del cuerpo del sitio -->

<h2>Formulario con campos ocultos</h2> <!-- Subtítulo principal -->
<form action="" method="post"> <!-- Formulario (envía vía POST) -->

  <input type="hidden" name="hora" value="3:30"> <!-- Campo oculto (no visible para el usuario) -->

  <label for="nombre">Ingresa tu nombre:</label> <!-- Etiqueta accesible para el nombre -->
  <input type="text" id="nombre" name="nombre"> <!-- Campo de entrada de texto -->
  <br><br> <!-- Saltos de línea -->

  <button type="submit">Enviar <i class="fa-regular fa-paper-plane"></i></button> <!-- Botón de envío con ícono -->
  <button type="reset">Borrar <i class="fa fa-trash"></i></button> <!-- Botón de borrado con ícono -->

</form> <!-- Fin del formulario -->

</body> <!-- Fin del cuerpo -->
</html> <!-- Fin del documento HTML -->
