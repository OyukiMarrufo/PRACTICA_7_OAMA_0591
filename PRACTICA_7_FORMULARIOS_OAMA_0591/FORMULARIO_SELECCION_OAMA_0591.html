<!DOCTYPE html> <!-- Declara el documento como HTML5 -->
<html lang="es"> <!-- Abre el documento en español -->
<head> <!-- Inicio de metadatos -->
  <meta charset="UTF-8"> <!-- Soporte para acentos y caracteres -->
  <title>Formulario con Selección</title> <!-- Título de la pestaña -->
</head> <!-- Fin de metadatos -->
<body> <!-- Inicio del cuerpo del sitio -->

<h2>Formularios con seleccion</h2> <!-- Subtítulo principal -->
<form action="" method="post"> <!-- Formulario (envía vía POST) -->

  <label for="nombre">Ingresa tu nombre:</label> <!-- Etiqueta para el nombre -->
  <input type="text" id="nombre" name="nombre"> <!-- Campo de entrada de texto -->
  <br><br> <!-- Saltos de línea -->

  <label for="pais">Selecciona tu pais:</label> <!-- Etiqueta para la lista desplegable -->
  <select id="pais" name="pais"> <!-- Lista desplegable -->
    <option value="1">Argentina</option> <!-- Opción 1 -->
    <option value="2">España</option> <!-- Opción 2 -->
    <option value="3">Mexico</option> <!-- Opción 3 -->
    <option value="4">Guatemala</option> <!-- Opción 4 -->
    <option value="5">Honduras</option> <!-- Opción 5 -->
    <option value="6">El Salvador</option> <!-- Opción 6 -->
    <option value="7">Venezuela</option> <!-- Opción 7 -->
    <option value="8">Colombia</option> <!-- Opción 8 -->
  </select> <!-- Fin de la lista desplegable -->
  <br><br> <!-- Saltos de línea -->

  <input type="submit" value="enviar"> <!-- Botón de envío -->
  <input type="reset" value="borrar"> <!-- Botón de borrado -->

</form> <!-- Fin del formulario -->

</body> <!-- Fin del cuerpo -->
</html> <!-- Fin del documento HTML -->
